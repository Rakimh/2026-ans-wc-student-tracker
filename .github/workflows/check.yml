name: Check ANS Winter 2026 Student Program

on:
  schedule:
    # Runs every 15 minutes, all day. Adjust if you want it tighter/looser.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you manually click "Run workflow" to test

permissions:
  contents: write   # needed so the job can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check_student_program.py

      - name: Commit state if changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "student-program-tracker-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "Update state [skip ci]"
            git push
          fi
